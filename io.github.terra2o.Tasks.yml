app-id: io.github.terra2o.Tasks
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk

command: Tasks

finish-args:
  - --socket=x11
  - --socket=wayland

  - --device=dri

modules:
  - name: tasks
    buildsystem: simple

    build-commands:
      - install -Dm755 Tasks /app/bin/Tasks
      - install -Dm644 io.github.terra2o.Tasks.desktop /app/share/applications/io.github.terra2o.Tasks.desktop
      - install -Dm644 io.github.terra2o.Tasks.png /app/share/icons/hicolor/256x256/apps/io.github.terra2o.Tasks.png
      - install -Dm644 io.github.terra2o.Tasks.metainfo.xml /app/share/metainfo/io.github.terra2o.Tasks.metainfo.xml

    sources:
      - type: file
        path: bin/Release/net10.0/linux-x64/publish/Tasks

      - type: file
        path: packaging/io.github.terra2o.Tasks.desktop

      - type: file
        path: packaging/io.github.terra2o.Tasks.png

      - type: file
        path: packaging/io.github.terra2o.Tasks.metainfo.xml
